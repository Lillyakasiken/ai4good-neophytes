# @package _global_
# Task 1, phase 1: few-shot site adaption by fine-tuning on real labels only.
# The received cv3 model is trained further on k labelled tiles per species of ONE
# held-out flight (recipe after Prabhakar et al. 2026, see the two configs below).
# Only the draw is set on the command line: flight, k and seed.
#
#   python train.py +experiment=adapt_cv3_finetune \
#       data.adapt_year=2025 data.adapt_flight=Rivera_1_1 data.few_shot_k=3 pl_seed=1
#   python test.py +experiment=adapt_eval exp_name=<run> \
#       "data.image_dir.test=['../data/Neophytes/2025/Rivera_1_1/train']"
defaults:
  - override /data: neophytes_split_cv3_adapt_512
  - override /model: model_neophytes_mit_b2_adapt

# # the received cv3 model (512 crops, seed 42)
init_ckpt: /zfs/ai4good/groups/neophytes/lightning_logs/20261013_002801.261406_np_cv3_Unet_mit_b2_512_s42/checkpoints/best_epoch=29.ckpt

# # W&B: train and rest-of-flight curves (train_f1_species, val_f1_species, *_f1_class_<i>);
# # needs `wandb login` once on the node, or logger=csv
logger: wandb

# # e.g. <date>_<time>_np_cv3_adapt_Rivera_1_1_k3_steps500_Unet_mit_b2_512_s1;
# # the np_cv3 prefix lets test.py pick the cv3 test config, adapt_report.py parses the rest
exp_name: ${now:%Y%m%d}_${now:%H%M%S.%f}_${data.data_name}_steps${model.max_steps}_${model.name}_${data.crop_size_train}_s${pl_seed}
