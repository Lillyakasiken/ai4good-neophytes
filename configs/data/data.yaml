# # Defaults shared by every data config. A split config (e.g.
# # neophytes_split_cv1_train_1024.yaml) composes this file with a class list, an
# # image-directory split and a transform set, and overrides what it needs.

# # value_mapping: {dataset name: {old pixel value: new value}}
# # The dataset name is the folder the tile lies in (e.g. '../data/Neophytes/...'),
# # so tiles from different sources can be mapped onto one shared class scheme.
# # Here it is only used to drop the two non-class values of the neophyte masks:
# #   254 = unlabelled area, 255 = uncertain label -> ignore_index (no loss, no metric)
value_mapping:
  Neophytes:
    254: ${data.ignore_index}
    255: ${data.ignore_index}

# # Per-image statistics (pixels per class, phenology, nodata). Generated by
# # dataset_stats.py and required for weighted sampling and few-shot selection.
dataset_stats: '../data/Neophytes/stats_imagewise.csv'

# # Pixel value excluded from loss and metrics
ignore_index: -1

# # Some defaults
data_name: null
load_auxiliary: False  # load canopy density + phenology (bands 2/3 of the mask) for the training set.
                       # Validation and the end-of-training test pass always load them, so the
                       # per-stage metrics can be logged. test.py turns this on for its own pass.
load_dsm: False        # surface model (set automatically from model.in_channels)
load_dtm: False        # terrain model
load_ndsm: False       # nDSM = DSM - DTM, i.e. object height above ground

# # Class imbalance: >99% of all pixels are background, and the six species differ
# # by two orders of magnitude in labelled area. A WeightedRandomSampler draws
# # images with a probability derived from how rare their rarest class is.
weighted_sampling: 'inverse_image'  # False, 'uniform', 'flat', 'inverse', 'inverse_image'
                                    # 'inverse_image' = inverse class frequency counted per
                                    # IMAGE, not per pixel (a huge blob then counts once)
min_strat_images: 10  # groups with fewer images are excluded from stratification
cap_quantile: 0.85    # clip the highest group weights down to this quantile (null = off);
                      # without it the rarest class is drawn almost every batch
lift_quantile: 0.15   # clip the lowest group weights up to this quantile (null = off)
bg_fraction: 0.10     # target share of background-only images per epoch (null = raw 1/count)

batch_size_train: 8
batch_size_val: 2
batch_size_test: 2
num_workers: 8

# # Drop mostly-empty orthophoto-edge tiles from TRAINING (val/test stay untouched so
# # metrics stay comparable). Tiles carrying a label are never dropped, the filter only
# # thins the background pool. Needs the nodata_px/total_px columns of dataset_stats.py.
max_nodata_frac: null

# # Preload the whole split into RAM: much faster training, but needs the memory
# # (a 1024px fold is tens of GB). Keep False while debugging.
load_into_ram: False

# # Few-shot training subset: k images per class, chosen by few_shot_mode.
# # null = use the full split.
few_shot_k: null
few_shot_mode: 'max_px_site_pheno'  # all, random, max_px, max_px_site, max_px_pheno,
                                    # max_px_site_pheno (most diverse: spreads the k images
                                    # over sites and phenological phases)
few_shot_bg_k: 1000  # additional background-only images (0 = none)
# # null = draw k tiles for every species. A list of stats_name values
# # (B_davidii, R_typhina, ...) draws k tiles only for those species.
few_shot_species: null

# # null = every site in the split. A site key such as Aarau_1 keeps every
# # flight of that site. A flight key such as Aarau_3_1 keeps that flight.
# # A list keeps the union. Applied to train and val. The test split stays
# # the fold's other sites, so val F1 is same-site and test F1 is held-out.
train_site: null

# # null = learn every stage, including pixels whose stage is unknown.
# # A list such as [nonflower] keeps only those stages (nonflower, flower,
# # fruiting). Pixels of any other stage become ignore_index, so they are
# # not learned as background. Labelled tiles with none of the chosen stages
# # are dropped. Background-only tiles stay. The test split is not filtered.
train_stages: null
# # When true, validation uses the same stage filter as training. Test does not,
# # so a test score still includes the stages that were left out of training.
stage_apply_val: true

# # Validation subset. null = validate on the complete val set, which is the honest
# # setting: filtering the val set down to labelled images removes exactly the
# # background-only tiles the test set is dominated by, so false positives on empty
# # ground would stay invisible in the monitored metric.
val_few_shot_k: null
val_few_shot_mode: 'all'
val_few_shot_bg_k: 0

# Opt-in faster validation. enabled: false (the default) scores the full val set,
# so runs stay comparable. enabled: true keeps every labelled tile (labelled: all)
# plus bg_k background-only tiles, via the same few-shot selection as
# val_few_shot_k. This changes which tiles are scored, not how any metric is
# computed. False positives on the background tiles left out stay invisible --
# the same caveat as filtering with val_few_shot_k.
#   data.val_subset.enabled=true data.val_subset.bg_k=300
val_subset:
  enabled: false
  labelled: all
  bg_k: 300
