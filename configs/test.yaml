# # Top-level evaluation config.
# #   python test.py exp_name=<run directory in lightning_logs/>
# # The data config is auto-selected from exp_name (see test.py); the entry below is
# # only the fallback. The model architecture comes from the checkpoint.
defaults:
  - _self_
  - data: data
  - model: model
  - override /data: neophytes_split_debug_test
  - override /model: model_neophytes_test

# # Which run and which checkpoint to evaluate
exp_name: ???        # required, e.g. 20260429_224213.131915_np_cv1_Unet_mit_b2_1024_s42
ckpt_type: best      # 'best' (highest val_f1_species; val_f1 for runs before 2026-10-12) or 'last'

pl_seed: 42

qualitative_only: False  # skip the (slow) quantitative pass, only draw prediction figures
# Forward precision. false (the default) is fp32, which is what every past test.py
# result used. true runs the forward in bfloat16, matching training's bf16-mixed,
# and casts probabilities back to fp32 before the metrics. The metric code is
# unchanged; scores can move in the last digits because the forward rounding
# changed. Leave false when comparing with older runs.
autocast: false
entropy_gamma: 0.5       # colour-scale warping of the entropy panel; <1 makes the small
                         # values visible, where nearly every pixel sits (1.0 = linear)

# # Breakdowns of the test metrics
eval_auxiliary: True  # per phenological phase and per canopy density (needs load_auxiliary)
eval_site: True       # per site
eval_month: True      # per acquisition month
eval_cv: True         # per cross-validation fold -- the basis of the headline metric

# # Threshold-independent AUROC (one-vs-rest per class + binary background-vs-neophyte)
compute_auc: True
auc_thresholds: 200   # score-axis discretization; memory is O(num_classes * thresholds)

# # Per-stage breakdown. Cells with fewer labelled pixels are drawn grey and are
# # not logged as scores. Same threshold as training (model.phenology_min_px).
phenology_min_px: ${model.phenology_min_px}

# # Where the breakdown table and figures go. 'csv' keeps them on disk only.
# # 'wandb' attaches them to the training run (looked up by name = exp_name),
# # or starts a new run in the same project if that run cannot be found.
logger: wandb
log_name: ai4good-neophytes
wandb_entity: max-zehnder-university-of-z-rich

# # Set when training used data.train_site. A site (Aarau_1), a flight
# # (Aarau_3_1), or a list of either. test.py then also scores those validation
# # tiles (same-site) and writes both that score and the held-out test-split
# # score to quantitative/metrics_site_split.json.
train_site: null

log_dir: lightning_logs
log_path: ${log_dir}/${exp_name}
ckpt_path: ${log_path}/checkpoints
test_path: ${log_path}/test_${now:%Y%m%d}_${now:%H%M%S.%f}_${data.data_name}_${ckpt_type}

matplotlib_style:
  text.usetex: false
  font.family: serif

hydra:
  job:
    name: test_neophyte_semseg
  sweep:
    dir: ${log_path}/hydra/multirun/${now:%Y-%m-%d-%H-%M-%S}
    subdir: ${hydra.job.num}
  run:
    dir: ${log_path}/hydra/${now:%Y-%m-%d-%H-%M-%S}
