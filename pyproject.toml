[project]
name = "ai4good-neophytes"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
  "numpy<2.3",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "opencv-python-headless",
  "tqdm",
  "rasterio>=1.4,<1.5",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "pytorch-lightning==2.5.2",
  "torchmetrics==1.8.0",
  "segmentation-models-pytorch==0.5.0",
  "timm==1.0.19",
  "huggingface-hub<1.0",
  "albumentations==2.0.8",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "wandb==0.21.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true